<button class="toast" id="toast" hidden></button>
<script>
// 起動で止まった時の安全装置: 画面が空のままなら、原因と「やり直す」を出す(真っ暗・真っ茶色のままにしない)
(function () {
  var first = '';
  window.addEventListener('error', function (e) { if (!first) first = (e.message || 'エラー') + (e.filename ? ' (' + e.filename.split('/').pop() + ':' + e.lineno + ')' : ''); });
  window.addEventListener('unhandledrejection', function (e) { if (!first) first = String(e.reason && e.reason.message || e.reason); });
  window.addEventListener('load', function () {
    setTimeout(function () {
      var app = document.getElementById('app');
      if (!app || app.children.length) return;
      app.innerHTML = '<div style="max-width:520px;margin:12vh auto;padding:24px;border-radius:14px;background:#FFFDF8;color:#2A1A08;font:15px/1.7 sans-serif;box-shadow:0 6px 24px #0004">'
        + '<b style="font-size:18px">画面を開けませんでした</b><p style="margin:8px 0;white-space:pre-wrap;word-break:break-all;color:#7a3a2a">' + (first || '原因が分かりませんでした').replace(/</g, '&lt;') + '</p>'
        + '<p style="margin:8px 0">古い保存ファイルが残っている時に起きることがあります。下のボタンで読み込み直してください。</p>'
        + '<button id="bootReset" style="font:inherit;padding:8px 16px;border-radius:10px;border:0;background:#4a2e1c;color:#fff;cursor:pointer">保存ファイルを消して読み込み直す</button></div>';
      document.getElementById('bootReset').onclick = function () {
        try { sessionStorage.clear(); } catch (e) {}
        var done = function () { location.reload(); };
        try {
          Promise.all([
            window.caches ? caches.keys().then(function (ks) { return Promise.all(ks.map(function (k) { return caches.delete(k); })); }) : 0,
            navigator.serviceWorker ? navigator.serviceWorker.getRegistrations().then(function (rs) { return Promise.all(rs.map(function (r) { return r.unregister(); })); }) : 0
          ]).then(done, done);
        } catch (e) { done(); }
      };
    }, 2500);
  });
})();
</script>
